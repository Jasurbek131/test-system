spring:
  application:
    name: test-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test_system}
    username: ${DB_USERNAME:test_system}
    password: ${DB_PASSWORD:test_system}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /api/swagger-ui
  api-docs:
    path: /api/v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    full-name: ${ADMIN_FULL_NAME:Administrator}
  seed:
    enabled: ${SEED_DATA:true}
    location: ${SEED_LOCATION:classpath:seed/*.json}
